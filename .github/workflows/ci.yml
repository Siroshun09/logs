  test-1_25-mock:
    uses: Siroshun09/gh-actions-workflows/.github/workflows/go-test.yml@v1
    with:
      working-dir: "./logmock"
      go-version: 1.25
  test-1_26-mock:
    uses: Siroshun09/gh-actions-workflows/.github/workflows/go-test.yml@v1
    with:
      working-dir: "./logmock"
      go-version: 1.26
